<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>Student registration form</h1>
        <br><br>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="enter your name">
        <br><br>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="enter you email">
        <br><br>
        <label for="password">Passwords</label>
        <input type="password" id="passwords" name="password" value="enter your password">
        <br>
        <label for="remember password">Renter password</label>
        <input type="password" id="remember password" name="remember password" value="renter your password">
        <br><br>
        <label for="dob">Enter your date of birth</label>
        <input type="date" id="dob" name="dob" value="DOB">
        <br><br>
        <p>Enter your gender</p>
        <br><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
         <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
         <input type="radio" id="other" name="gender" value="other">
        <label for="other">other</label>
        <br><br>
        <label for="course">Select your course</label>
        <select id="course" name="course">
        <option value=" ">select course</option>
        <option value="bsc.cse">Bsc Computer Science</option>  
        <option value="bsc.phy">Bsc Physics</option>
        <option value="bsc.maths">Bsc maths</option>
        </select>
        <br><br>
        <h4>Your hobbies</h4>
        <input type="checkbox" id="coding" value="coding" name="hobbies">
        <label for="coding">Coding</label>
        <input type="checkbox" id="cooking" value="cooking" name="hobbies">
        <label for="coding">Cooking</label>
        <input type="checkbox" id="playing" value="playing" name="hobbies">
        <label for="playing">playing</label>
        <br><br>
        <label for="address">Enter your address</label>
        <textarea id="address" name="address" value="Enter your address" row="5" col="30"></textarea>
        <br><br>
        <button type="submit">submit form</button>
        <br>
        <button type="reset">reset form</button>
    </form>
</body>
</html>
